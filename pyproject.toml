[project]
name = "vinted-bot"
version = "0.1.0"
description = "Privater Vinted-Monitoring-Bot für Discord"
requires-python = ">=3.14"
# Abhängigkeiten werden über requirements.txt gepinnt; hier nur zur Installation als Paket.
dependencies = []

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vinted_bot = ["storage/schema.sql"]

[tool.pytest.ini_options]
# "." damit Tests auch scripts/ importieren können
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
